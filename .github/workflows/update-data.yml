name: Update tracker data

on:
  schedule:
    - cron: "17 13 * * *"   # daily ~13:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install optional deps (Google Trends, best-effort)
        run: pip install --quiet pytrends || true

      - name: Fetch data
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_data.py

      - name: Commit & push if changed
        run: |
          git config user.name "tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/data.js
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "data: automated refresh $(date -u +%F)"
          git push
